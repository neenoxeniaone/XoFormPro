<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FormSubmissionPro — Test Form</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 520px; margin: 40px auto; padding: 0 16px; color: #0f172a; }
    h1 { font-size: 20px; }
    label { display: block; margin: 14px 0 4px; font-weight: 600; font-size: 14px; }
    input, textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; box-sizing: border-box; }
    button { margin-top: 18px; background: #7c3aed; color: #fff; border: 0; padding: 10px 18px; border-radius: 8px; font-size: 14px; cursor: pointer; }
    .note { background: #f1f5f9; padding: 12px; border-radius: 8px; font-size: 13px; margin-bottom: 20px; }
    #result { margin-top: 16px; padding: 12px; border-radius: 8px; font-size: 13px; white-space: pre-wrap; display: none; }
    .ok { background: #dcfce7; color: #166534; }
    .err { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>
  <h1>Test Form → FormSubmissionPro</h1>

  <div class="note">
    1. Create a form in the dashboard (<a href="http://localhost:5173" target="_blank">localhost:5173</a>) and copy its <b>access key</b>.<br />
    2. Paste it below, fill the form, and submit.<br />
    3. Watch the submission appear in the dashboard and the email print in the API console.
  </div>

  <label>Access key</label>
  <input id="accessKey" placeholder="paste-your-access-key-here" />

  <!-- This form posts straight to the API, exactly like a real website would. -->
  <form id="contact">
    <label>Name</label>
    <input name="name" placeholder="Jane Doe" required />

    <label>Email</label>
    <input type="email" name="email" placeholder="jane@example.com" required />

    <label>Message</label>
    <textarea name="message" rows="4" placeholder="Hello!" required></textarea>

    <!-- Honeypot: bots fill this; humans never see it. Keep hidden. -->
    <input type="checkbox" name="botcheck" style="display:none" tabindex="-1" autocomplete="off" />

    <button type="submit">Send</button>
  </form>

  <div id="result"></div>

  <script>
    const API = "http://localhost:5074/submit";
    const form = document.getElementById("contact");
    const result = document.getElementById("result");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const accessKey = document.getElementById("accessKey").value.trim();
      if (!accessKey) { show("Please paste an access key first.", false); return; }

      const data = Object.fromEntries(new FormData(form));
      data.access_key = accessKey;

      try {
        const res = await fetch(API, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        });
        const json = await res.json();
        show(JSON.stringify(json, null, 2), res.ok);
        if (res.ok) form.reset();
      } catch (err) {
        show("Request failed: " + err.message, false);
      }
    });

    function show(msg, ok) {
      result.textContent = msg;
      result.className = ok ? "ok" : "err";
      result.style.display = "block";
    }
  </script>
</body>
</html>
